        SSE `result` event data is an array of `SearchItem`.
      operationId: reverseGeocode
      tags: [search]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                  format: double
                lon:
                  type: number
                  format: double
                size:
                  type: integer
                  default: 5
                language:
                  type: string
                  example: en
              required: [lat, lon]
      responses:
        '200':
          description: |
            SSE stream. Each event has an `event` field and a JSON `data` field.
            The `result` event delivers an array of `SearchItem`.
          content:
            text/event-stream:
              schema:
                description: Event data payload — shape depends on the event type
                oneOf:
                  - description: queued event data
                    type: object
                    properties:
                      job_id:
                        type: string
                      queue_position:
                        type: integer
                  - description: result event data
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchItem'
                  - description: error event data
                    allOf:
                      - $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':

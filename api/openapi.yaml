  /v1/tiles/{path}:
    get:
      summary: Vector tile reverse proxy
      description: |
        Reverse proxy to `tilesservice`. Injects a service client token with
        `tiles:serve` scope. The full path is forwarded to tilesservice.

        Common sub-paths:
        - `ping` — health check (public on upstream)
        - `styles` — list map styles
        - `styles/{name}` — serve a MapLibre GL style
        - `{tileset}/{z}/{x}/{y}` — serve an MVT vector tile
      operationId: getTile
      tags: [tiles]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Path forwarded to tilesservice (everything after `/v1/tiles/`)
      responses:
        '200':
          description: Response from tilesservice (binary tile, JSON style, or text)
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


openapi: "3.0.3"

info:
  title: SwayRider API
  version: "1.0"
  description: |
    Public HTTP API served by `swayrider-api` on port **8080**. It is the single
    entry point for mobile and web clients. Requests are proxied to backend
    microservices (authservice, regionservice, routerservice, searchservice,
    tilesservice) behind the scenes.

    ### Authentication

    Endpoints that require authentication accept the access token (JWT RS256,
    15-minute TTL) either as:
    - `Authorization: Bearer <token>` header, or
    - `access_token` HTTP-only cookie (base64-encoded, set by login/refresh).

    The refresh token (64-byte hex, 30-day TTL, single-use) is accepted via the
    `refresh_token` HTTP-only cookie or in the request body.

    ### SSE Protocol

    The `/api/v1/route`, `/api/v1/search`, and `/api/v1/search/reverse` endpoints
    deliver results asynchronously via **Server-Sent Events** (`text/event-stream`).

    Event types:

    | Event | Data |
    |---|---|
    | `queued` | `{"job_id":"…","queue_position":N}` |
    | `result` | Operation-specific result object |
    | `error` | `{"error":"…"}` |

servers:
  - url: https://api.swayrider.com
    description: Production

tags:
  - name: health
    description: Service health
  - name: auth
    description: Authentication and user management
  - name: route
    description: Route planning (async SSE)
  - name: search
    description: Geocoding (async SSE)
  - name: region
    description: Spatial region queries
  - name: tiles
    description: Vector tile serving (reverse proxy to tilesservice)
  - name: admin
    description: Admin-only endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    LatLon:
      type: object
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
      required: [lat, lon]

    BoundingBox:
      type: object
      properties:
        bottom_left:
          $ref: '#/components/schemas/LatLon'
        top_right:
          $ref: '#/components/schemas/LatLon'
      required: [bottom_left, top_right]

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          description: JWT RS256 access token (15-minute TTL)
        refresh_token:
          type: string
          description: Hex-encoded 64-byte refresh token (30-day TTL, single-use)
      required: [access_token, refresh_token]

    LoginResponse:
      type: object
      description: |
        Successful login. When the account has MFA enabled the response carries
        `mfa_required: true` plus a one-time `mfa_token` challenge instead of
        tokens (no cookies are set); the caller must exchange it via
        `POST /api/v1/auth/mfa/verify` to obtain the token pair.
      properties:
        access_token:
          type: string
          description: JWT RS256 access token (15-minute TTL); absent when MFA is required
        refresh_token:
          type: string
          description: Hex-encoded 64-byte refresh token (30-day TTL, single-use); absent when MFA is required
        mfa_required:
          type: boolean
          description: true when the account has MFA enabled and a second factor must be completed
          example: true
        mfa_token:
          type: string
          description: Single-use pending-login challenge token; present only when `mfa_required` is true
      required: [mfa_required]

    UserInfo:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        is_verified:
          type: boolean
        is_admin:
          type: boolean
        account_type:
          type: string
          example: free
      required: [user_id, email, is_verified, is_admin, account_type]

    SearchItem:
      type: object
      properties:
        label:
          type: string
        locality:
          type: string
        region:
          type: string
        country:
          type: string
        confidence:
          type: number
          format: double
        layer:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        street:
          type: string
        houseNumber:
          type: string
        id:
          type: string
        localAdmin:
          type: string
        countryCode:
          type: string
        name:
          type: string

    RegionList:
      type: object
      properties:
        core_regions:
          type: array
          items:
            type: string
        extended_regions:
          type: array
          items:
            type: string
      required: [core_regions, extended_regions]

    Waypoint:
      type: object
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        type:
          type: string
          enum: [break, through, via]
          default: break
          description: |
            `break` — split route into legs, allow u-turns (default).
            `through` — no u-turns, no leg split.
            `via` — allow u-turns, no leg split.
      required: [lat, lon]

    RouteOptions:
      type: object
      properties:
        avoidTollRoads:
          type: boolean
        avoidHighways:
          type: boolean
        avoidFerries:
          type: boolean
        scenicPreference:
          type: integer
        highwayAvoidance:
          type: integer
        tollAvoidance:
          type: integer
        unpavedHandling:
          type: string

    CrossingConfig:
      type: object
      properties:
        type:
          type: string
          enum: [simple, advanced]
          default: simple
        road_type_order:
          type: array
          items:
            type: string
            enum: [MOTORWAY, TRUNK, PRIMARY, SECONDARY]
        road_type_delta:
          type: integer
        drop_distance:
          type: integer

    CrossingLocation:
      type: object
      properties:
        from_region:
          type: string
        to_region:
          type: string
        road_type:
          type: string
        location:
          $ref: '#/components/schemas/LatLon'
        osm_id:
          type: integer
          format: int64

    ServiceClient:
      type: object
      properties:
        client_id:
          type: string
        name:
          type: string
        description:
          type: string
        scopes:
          type: array
          items:
            type: string

    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        registered:
          type: boolean

paths:
  /health:
    get:
      summary: Service health check
      operationId: getHealth
      tags: [health]
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: swayrider-api

  /api/openapi.yaml:
    get:
      summary: OpenAPI specification
      operationId: getOpenAPISpec
      tags: [health]
      security: []
      responses:
        '200':
          description: OpenAPI 3.0 YAML specification
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                remember_me:
                  type: boolean
                  default: false
              required: [email, password]
      responses:
        '200':
          description: |
            Login successful. Sets `access_token` and `refresh_token` HTTP-only cookies,
            unless the account has MFA enabled — then no cookies are set and the response
            carries `mfa_required: true` + `mfa_token` for the second-factor step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/mfa/setup:
    post:
      summary: Start MFA enrollment
      description: |
        Generates a fresh TOTP secret for the authenticated user (stored encrypted,
        not yet enabled) and returns the base32 secret (shown once, for manual entry
        into an authenticator app), the otpauth URL, and a server-rendered QR PNG of
        the URL (base64).
      operationId: mfaSetup
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Enrollment started
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: Base32 TOTP secret, shown exactly once
                  otpauth_url:
                    type: string
                  qr_png_base64:
                    type: string
                    description: Base64-encoded PNG QR of the otpauth URL
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: MFA already enabled, or MFA disabled globally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/mfa/enable:
    post:
      summary: Complete MFA enrollment
      description: |
        Verifies one TOTP code against the pending secret, enables MFA, and issues
        the fresh backup-code set (plaintext, shown once).
      operationId: mfaEnable
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: TOTP code from the authenticator app
              required: [code]
      responses:
        '200':
          description: MFA enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup_codes:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid authentication code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: MFA already enabled, not set up, or disabled globally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/mfa/disable:
    post:
      summary: Disable MFA
      description: |
        Disables MFA for the authenticated user (deletes the enrollment row and all
        backup codes). The account password is required and verified.
      operationId: mfaDisable
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
              required: [password]
      responses:
        '204':
          description: MFA disabled
        '401':
          description: Missing or invalid JWT, or wrong password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: MFA disabled globally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/mfa/status:
    get:
      summary: Get MFA status
      description: Reports whether the authenticated user has MFA enabled.
      operationId: mfaStatus
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: MFA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: MFA disabled globally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/mfa/verify:
    post:
      summary: Complete the second factor
      description: |
        Exchanges the pending-login challenge token (from a login that returned
        `mfa_required`) plus a TOTP code for the normal token pair. On success
        sets the same HTTP-only cookies as login. Backup codes are not accepted
        here -- a lost authenticator is recovered via
        `POST /api/v1/auth/mfa/reset/request` instead.
      operationId: mfaVerify
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mfa_token:
                  type: string
                  description: Challenge token from the login response
                code:
                  type: string
                  description: TOTP code
                remember_me:
                  type: boolean
                  default: false
              required: [mfa_token, code]
      responses:
        '200':
          description: Second factor accepted. Sets `access_token` and `refresh_token` cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid, expired, or exhausted challenge; invalid code; locked MFA scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/mfa/backup-codes:
    post:
      summary: Regenerate backup codes
      description: |
        Replaces the authenticated user's backup-code set with a fresh one
        (invalidating the previous set) and returns the new plaintext codes once.
        The account password is required.
      operationId: mfaBackupCodes
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
              required: [password]
      responses:
        '200':
          description: New backup codes (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup_codes:
                    type: array
                    items:
                      type: string
        '401':
          description: Missing or invalid JWT, or wrong password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: MFA not enabled, or disabled globally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/mfa/reset/request:
    post:
      summary: Request an email-verified MFA/TOTP reset
      description: |
        The only way to recover a lost authenticator -- there is no direct
        backup-code login. Requires all three of: account password, a
        single-use backup code, and access to the registered email. Verifies
        email+password with the same protection as login, then consumes one
        backup code, and only then emails a reset link. The link lands on a
        web page (the app has no deep-linking yet) that lets the user set up
        a new authenticator; the current secret stays valid until that
        page's confirmation step succeeds.
      operationId: requestMfaReset
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                backup_code:
                  type: string
                  description: One of the account's single-use backup codes. Consumed on success.
                mfa_reset_url:
                  type: string
                  format: uri
              required: [email, password, backup_code, mfa_reset_url]
      responses:
        '204':
          description: Request accepted (email sent if the account exists, the password matches, the backup code is valid and unused, and MFA is enabled)
        '401':
          description: Invalid email or password, or invalid/already-used backup code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: MFA not enabled on this account, or disabled globally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      summary: Register a new user account
      operationId: register
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                verification_url:
                  type: string
                  format: uri
              required: [email, password, verification_url]
      responses:
        '200':
          description: User created. Verification email will be sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  message:
                    type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      description: |
        Exchange a refresh token for a new access + refresh token pair (token rotation).
        Accepts the refresh token from the `refresh_token` cookie (set by login) or
        from the request body.
      operationId: refreshToken
      tags: [auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Required if not using the cookie
                remember_me:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Token refreshed. Sets updated cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: Logout
      description: |
        Invalidate the current refresh token. Accepts token from the `refresh_token`
        cookie or request body. Clears auth cookies.
      operationId: logout
      tags: [auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Logged out
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/request-password-reset:
    post:
      summary: Request a password reset email
      description: Always returns 204 to prevent email enumeration.
      operationId: requestPasswordReset
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                reset_url:
                  type: string
                  format: uri
              required: [email, reset_url]
      responses:
        '204':
          description: Request accepted (email sent if account exists)
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/reset-password:
    post:
      summary: Complete password reset
      operationId: resetPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  format: uuid
                token:
                  type: string
                new_password:
                  type: string
                  format: password
              required: [user_id, token, new_password]
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/verify-email:
    post:
      summary: Request a new verification email
      operationId: verifyEmail
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                verification_url:
                  type: string
                  format: uri
              required: [email, verification_url]
      responses:
        '204':
          description: Verification email sent

  /api/v1/auth/change-password:
    post:
      summary: Change the authenticated user's password
      operationId: changePassword
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
              required: [old_password, new_password]
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Wrong current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/check-password-strength:
    post:
      summary: Check password strength
      operationId: checkPasswordStrength
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required: [password]
      responses:
        '200':
          description: Strength result
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_strong:
                    type: boolean
                  message:
                    type: string

  /api/v1/auth/public-keys:
    get:
      summary: Get JWT RS256 public verification keys
      description: Returns the in-memory public key cache. No downstream gRPC call.
      operationId: getPublicKeys
      tags: [auth]
      security: []
      responses:
        '200':
          description: Public keys (PEM-encoded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: string
                    example:
                      - "-----BEGIN PUBLIC KEY-----\nMIIBIj...\n-----END PUBLIC KEY-----"

  /api/v1/auth/whoami:
    get:
      summary: Get current user info (from authservice)
      description: Makes a gRPC call to authservice. Requires a valid JWT.
      operationId: whoAmI
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Get current user claims (from JWT, no gRPC call)
      operationId: getMe
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Claims parsed from the JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  email_verified:
                    type: boolean
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/route:
    post:
      summary: Plan a route (async SSE)
      description: |
        Plan a route between two coordinates. Results are delivered via
        **Server-Sent Events** (`text/event-stream`).

        SSE events:
        - `queued` — `{"job_id":"…","queue_position":N}`
        - `result` — Route result with `trip`, `legs`, `maneuvers`, `summary`
        - `error` — `{"error":"…"}`
      operationId: planRoute
      tags: [route]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  $ref: '#/components/schemas/LatLon'
                to:
                  $ref: '#/components/schemas/LatLon'
                waypoints:
                  type: array
                  items:
                    $ref: '#/components/schemas/Waypoint'
                vehicle:
                  type: string
                  enum: [car, motorscooter, motorcycle]
                unit:
                  type: string
                  example: kilometers
                language:
                  type: string
                  example: en-US
                options:
                  $ref: '#/components/schemas/RouteOptions'
              required: [from, to, vehicle]
      responses:
        '200':
          description: SSE stream. Connection stays open until `result` or `error` event is sent.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Queue full or rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error or downstream failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/search:
    post:
      summary: Forward geocoding (async SSE)
      description: |
        Search for locations by text query. Results delivered via SSE.

        SSE events:
        - `queued` — `{"job_id":"…","queue_position":N}`
        - `result` — Array of `SearchItem`
        - `error` — `{"error":"…"}`
      operationId: search
      tags: [search]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                viewport:
                  type: object
                  properties:
                    bottomLeft:
                      $ref: '#/components/schemas/LatLon'
                    topRight:
                      $ref: '#/components/schemas/LatLon'
                focusPoint:
                  $ref: '#/components/schemas/LatLon'
                size:
                  type: integer
                  default: 10
                language:
                  type: string
                  example: en
              required: [text]
      responses:
        '200':
          description: |
            SSE stream. Each event has an `event` field and a JSON `data` field.
            The `result` event delivers an array of `SearchItem`.
          content:
            text/event-stream:
              schema:
                description: Event data payload — shape depends on the event type
                oneOf:
                  - description: queued event data
                    type: object
                    properties:
                      job_id:
                        type: string
                      queue_position:
                        type: integer
                  - description: result event data
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchItem'
                  - description: error event data
                    allOf:
                      - $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

